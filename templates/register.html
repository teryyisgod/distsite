{% extends "base.html" %}
{% block title %}新規登録{% endblock %}
{% block content %}
<div class="col-md-5 mx-auto p-4 bg-white rounded shadow-sm">
    <h2 class="mb-4">新規登録</h2>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">ユーザー名</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">パスワード(8文字以上)</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登録する</button>
    </form>
</div>
{% endblock %}
