<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}配布サイト{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">配布サイト</a>
            <div>
                {% if current_user.is_authenticated %}
                    <span class="text-light me-2">{{ current_user.username }} さん</span>
                    <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">ログアウト</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('login') }}">ログイン</a>
                    <a class="btn btn-light btn-sm" href="{{ url_for('register') }}">新規登録</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for m in messages %}
                    <div class="alert alert-warning">{{ m }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
