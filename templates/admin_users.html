{% extends "base.html" %}
{% block title %}ユーザー一覧{% endblock %}
{% block content %}
<div class="p-4 bg-white rounded shadow-sm">
    <h2 class="mb-4">登録ユーザー一覧(管理者用)</h2>
    {% if users %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ユーザー名</th>
		    <th>パスワード</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u["id"] }}</td>
                    <td>{{ u["username"] }}</td>
                    <td>{{ u["password_hash"] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p class="text-muted">登録ユーザーはいません。</p>
    {% endif %}
</div>
{% endblock %}
